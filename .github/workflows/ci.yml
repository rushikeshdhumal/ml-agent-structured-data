name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref -- the suite is CPU-bound and slow,
# so queued duplicates waste minutes without adding signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Generous relative to the ~7 min this suite takes on a 16-core dev box.
    # GitHub runners have far fewer cores and the tests are CPU-bound (they
    # train real models rather than mocking them, with scikit-learn using
    # n_jobs=-1), so a slower wall-clock here is expected, not a hang. This cap
    # exists to catch a genuine hang, not to police normal runtime.
    timeout-minutes: 45

    strategy:
      # Report both versions independently, so one failing does not hide the
      # other's result.
      fail-fast: false
      matrix:
        # The bookends of `requires-python = ">=3.12,<3.14"` in pyproject.toml.
        # This matrix is not cosmetic: dependency resolution genuinely differs
        # per Python version here, and an earlier 3.10 job in this same matrix
        # is what surfaced why the floor is 3.12 rather than 3.10 -- crewai ->
        # chromadb -> onnxruntime has no cp310 wheel above 1.23.x, and more
        # importantly each Python resolves a different shap (3.10 -> 0.49.1,
        # 3.11 -> 0.51.0, 3.12+ -> 0.52.0), while explain_tools.py's SHAP
        # output-shape handling is only verified against 0.52.0. Keep both jobs:
        # 3.12 is the floor being claimed and nobody develops on it.
        python-version: ["3.12", "3.13"]

    name: test (py${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # Bare `pytest` is deliberate. pyproject.toml's addopts already carries
        # `-m 'not e2e'`, which excludes tests/e2e/ -- that suite calls a live
        # LLM and needs a real API key, so it cannot run here and is executed
        # manually instead. Do not add `-m e2e` to this workflow.
        run: uv run pytest
