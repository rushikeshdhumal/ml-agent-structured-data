eda_task:
  description: >
    Call the eda_summary tool exactly once for run {run_id} and summarize the dataset's
    schema, missingness, cardinality, target correlations, near-duplicate columns, class
    balance, and any leakage flags. Report only what the tool returned -- never invent
    statistics.
  expected_output: >
    A complete EdaReport covering every field the eda_summary tool returned.
  agent: eda_analyst

propose_cleaning_task:
  description: >
    Using the EDA report as context, propose a per-column CleaningPlan for run {run_id} that
    addresses missing values, outliers, and any columns worth dropping. Never propose an
    action on the target column '{target}'. Explain your rationale.
  expected_output: >
    A structured CleaningPlan with a clear rationale for every action.
  agent: cleaning_strategist
  context:
    - eda_task

execute_cleaning_task:
  description: >
    Call apply_cleaning_plan with exactly the human-approved CleaningPlan from the previous
    task, incorporating any edits the human made. Do not alter the plan's substance yourself.
  expected_output: >
    Confirmation of the dataset's shape before and after cleaning.
  agent: cleaning_strategist
  context:
    - propose_cleaning_task

propose_feature_task:
  description: >
    Using the EDA report as context, propose a FeatureEngineeringPlan for run {run_id} that
    explicitly covers every non-target column with an encoding/scaling choice or lists it in
    features_to_drop. Never include the target column '{target}' in column_plans.
  expected_output: >
    A structured FeatureEngineeringPlan covering every feature column, with rationale.
  agent: feature_engineer
  context:
    - eda_task
    - execute_cleaning_task

execute_feature_task:
  description: >
    Call apply_feature_plan with exactly the human-approved FeatureEngineeringPlan from the
    previous task, incorporating any edits the human made.
  expected_output: >
    Confirmation of the number of engineered features produced.
  agent: feature_engineer
  context:
    - propose_feature_task

propose_metric_task:
  description: >
    Using the EDA report as context for run {run_id}, propose the optimization metric that
    every later stage (model selection, hyperparameter tuning, ensembling, and evaluation)
    should be scored and optimized against. Choose from the metrics allowed for this task's
    type, defaulting to the system default unless the EDA report gives a clear reason to
    prefer another (e.g. class imbalance may favor balanced_accuracy, f1_macro, or roc_auc
    over plain accuracy; regression currently only offers r2). Explain your rationale.
  expected_output: >
    A structured MetricChoice naming exactly one allowed metric, with rationale.
  agent: model_selector
  context:
    - eda_task

set_metric_task:
  description: >
    Call set_evaluation_metric with exactly the human-approved metric choice from the
    previous task, incorporating any edits the human made. Do not alter the choice yourself.
  expected_output: >
    Confirmation of the metric that will be used for the rest of the run.
  agent: model_selector
  context:
    - propose_metric_task

model_selection_task:
  description: >
    Call train_candidate_models for run {run_id} and report the resulting leaderboard, sorted
    best-first, with the cross-validation metric used.
  expected_output: >
    A complete Leaderboard of all candidate models with their CV scores.
  agent: model_selector
  context:
    - execute_feature_task
    - set_metric_task

hpo_task:
  description: >
    Call tune_model_hyperparameters for the top model-selection leaderboard candidate(s) for
    run {run_id}, then report the best hyperparameters and scores found.
  expected_output: >
    HpoResults for each tuned model.
  agent: hpo_tuner
  context:
    - model_selection_task

ensembling_task:
  description: >
    Call build_ensemble for run {run_id} to combine the strongest model-selection/HPO
    candidates into a metric-optimized ensemble (soft voting, weighted voting, greedy
    selection, or stacking -- whichever cross-validates best on the run's chosen metric).
    Report the winning strategy, its members/weights, and how it compares to the best single
    model. If the tool reports too few viable candidates to ensemble, say so plainly and move
    on -- do not treat it as a failure.
  expected_output: >
    A complete EnsembleReport describing the winning strategy and its cross-validated score,
    or a plain statement that ensembling was skipped and why.
  agent: ensembler
  context:
    - model_selection_task
    - hpo_task

evaluation_task:
  description: >
    Call evaluate_models for run {run_id} on the tuned candidate(s) and, if build_ensemble
    produced one, the "ensemble" candidate too -- score them together in the same call. In
    your final answer, also state in plain language which model you recommend and why,
    explicitly comparing the ensemble against the best single model on the run's chosen
    metric, and call out any leakage_suspicion flag. The explanation stage runs next and
    presents your recommendation to a human together with evidence of what the model
    learned, so make your recommendation and your reservations explicit enough to carry
    into that review.
  expected_output: >
    A complete EvaluationBundle with metrics for every tuned model requested, including the
    ensemble if one was built.
  agent: evaluator
  context:
    - hpo_task
    - ensembling_task

explanation_task:
  description: >
    Call explain_models exactly once for run {run_id} to explain the model(s) that were just
    evaluated. Then, in plain language a non-specialist can act on, report: which original
    dataset columns actually drive the model you recommend (use column_importance, not the
    encoded feature names); whether any top column could plausibly be a proxy for the target
    '{target}' and therefore a leakage risk worth investigating before approval; what the
    model's most confident mistakes reveal about where it fails; and whether the surrogate
    fidelity is high enough for the simple rules to be trusted as a description of the model.
    Report only what the tool returned -- never assert that a feature matters if
    explain_models did not measure it. State plainly which engineered features contributed
    nothing. This is the evidence a human will use to approve or reject the model, so be
    direct about weaknesses rather than presenting the model in its best light.
  expected_output: >
    A complete ExplanationBundle for every model explained, plus a plain-language summary of
    what drives the recommended model, any leakage concerns, and any reason for caution.
  agent: explainer
  context:
    - evaluation_task

finalize_task:
  description: >
    You MUST call finalize_run for run {run_id} exactly once as your final action in this
    task, regardless of whether explicit human feedback is present -- never end this task
    with only a question or a description of what you would do. Read the human's feedback
    attached to the previous task and set approved to true only if that feedback is an
    unambiguous approval; if it is missing, unclear, or absent entirely, call finalize_run
    with approved=false. Pass the human's feedback text through to finalize_run unchanged
    (empty string if there was none).
  expected_output: >
    Confirmation from finalize_run of whether the run was finalized as approved or rejected.
  agent: evaluator
  context:
    - evaluation_task
    - explanation_task
