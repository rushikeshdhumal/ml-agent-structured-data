[project]
name = "ml-agent-structured-data"
version = "0.1.0"
description = "DS-Crew: a multi-agent system, hosted as Azure AI Foundry agents, covering the data science lifecycle for structured data: EDA, cleaning, feature engineering, model selection, HPO, evaluation, and metadata logging."
readme = "README.md"
# Floor is set by shap, and deliberately claims only what is actually tested.
# shap 0.52.0 -- the release explain_tools.py's SHAP output-shape handling was
# written and live-verified against -- itself requires >=3.12. Older Pythons
# silently resolve to older shap (3.11 -> 0.51.0, 3.10 -> 0.49.1), whose
# TreeExplainer return shapes differ, so supporting them would mean shipping
# explainability against versions nobody has exercised.
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Rushikesh Dhumal" }]
dependencies = [
    "pandas>=2.2,<3",
    # Upper bound is set by shap, not by anything this project needs directly:
    # shap depends on numba (a hard dependency on every platform except
    # darwin/x86_64), and numba 0.66.0 -- the latest -- requires numpy<2.5.
    # Without this cap uv backtracks through numba releases looking for one
    # that accepts numpy 2.5.x, finds none, and lands on a 2021-era
    # numba/llvmlite pair that cannot build on Python 3.13 at all. Lift this
    # only once numba publishes numpy 2.5 support.
    "numpy>=1.26,<2.5",
    "scikit-learn>=1.5,<2",
    "optuna>=3.6,<4",
    "mlflow>=2.15,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.9,<4",
    "joblib>=1.4,<2",
    "xgboost>=2.0,<3",
    "lightgbm>=4.0,<5",
    "catboost>=1.2,<2",
    "shap>=0.46,<1",
    # Not imported directly -- it is shap's transitive dependency, floored here
    # to steer uv's *universal* resolution. Resolving for a single interpreter
    # picks a current numba correctly, but resolving across the whole
    # requires-python range at once, uv forks and selects numba 0.53.1 (a 2021
    # release), whose ancient llvmlite then fails to build on any modern Python.
    # Re-verified after narrowing requires-python to >=3.12: still reproducible,
    # so this floor is still load-bearing. Drop it only if a `uv pip compile
    # --universal` run without it stops producing numba 0.53.1.
    "numba>=0.60",
]

[project.optional-dependencies]
# The HTTP tool service (ds_crew.service). Optional so that importing
# ds_crew.schemas/ds_crew.tools as a library does not pull a web stack.
# fastapi/uvicorn already arrive transitively today (mlflow depends on them),
# which is precisely why they are declared here too: a transitive package is
# not a contract, and mlflow is free to drop either one in a minor release.
service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # MCP surface (service/mcp_app.py). Azure AI Foundry's gpt-5-family
    # deployments offer the "mcp" custom tool but not "openapi", so this is
    # the only protocol a Foundry agent can reach these tools over.
    "mcp>=1.2,<2",
]
# Driving the eight agents hosted in an Azure AI Foundry project
# (ds_crew.foundry). Optional and isolated because azure-ai-projects pulls a
# sizeable Azure stack (azure-core, msal, azure-storage-blob) that the tool
# service itself never touches -- it only ever reaches ds_crew.foundry over
# HTTP/MCP, exactly as a Foundry agent does, so running just the service
# never pays for this extra.
#
# Range rescoped 2026-08-26 for the MAF port: agent-framework-foundry (the
# `maf` extra below) pins azure-ai-projects<2.4, which is a hard conflict with
# the `>=2.5` floor this used to carry -- the same conflict shape that forced
# crewai out of this project entirely (see GOTCHAS.md). That old floor existed
# only for the now-deleted orchestrator.build_project_client()'s direct
# AIProjectClient(allow_preview=True) call; azure-ai-projects 2.2-2.3 supports
# the same construction, so there is no functional loss in narrowing this.
foundry = [
    "azure-ai-projects>=2.2,<2.4",
    "azure-identity>=1.19,<2",
]
# Microsoft Agent Framework's Foundry integration (ds_crew.maf). Foundry's
# in-portal Workflow UI retires 2026-12-01 with Microsoft's own migration
# guidance pointing here, so this replaces ds_crew.foundry's hand-written
# orchestrator rather than living alongside it. Pulls a compatible
# azure-ai-projects transitively -- see the `foundry` extra's comment above for
# why the range that resolves is <2.4, not >=2.5.
maf = [
    "agent-framework-foundry>=1.11,<2",
]
# Exports the OTel traces/metrics/logs agent_framework already emits (enabled
# by default, just unexported until something configures a destination) to
# Application Insights. Separate from `maf` because it's optional -- ds-crew-maf
# works fine without it, just with spans created and immediately dropped.
observability = [
    "azure-monitor-opentelemetry>=1.8,<2",
]
# On-demand (not continuous) evaluation of a completed run via the Azure AI
# Evaluation SDK's Groundedness/TaskAdherence/ToolCallAccuracy evaluators --
# see ds_crew.maf.azure_evaluation and `ds-crew-maf --evaluate`. Each
# evaluator call is a real, billed LLM-judge call against the same
# ds-crew-resource account's plain Azure-OpenAI-compatible endpoint, not
# the Foundry Agents surface the rest of ds_crew.maf drives. Separate from
# `maf` because it's optional -- a normal run never touches this.
evaluation = [
    "azure-ai-evaluation>=1.18,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    # ds_crew.maf is async throughout (Microsoft Agent Framework's workflow
    # APIs are all `async def`), which the rest of this project's test suite
    # never needed before it.
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    # tests/test_service.py exercises the service, so the dev environment needs
    # the same stack rather than inheriting it by luck. httpx backs FastAPI's
    # TestClient.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "mcp>=1.2,<2",
    # tests/test_foundry_*.py and tests/test_maf_*.py exercise ds_crew.foundry
    # and ds_crew.maf against fakes, but both import azure/agent_framework at
    # call time, so the dev environment needs the real packages too.
    "azure-ai-projects>=2.2,<2.4",
    "azure-identity>=1.19,<2",
    "agent-framework-foundry>=1.11,<2",
    "azure-monitor-opentelemetry>=1.8,<2",
    "azure-ai-evaluation>=1.18,<2",
]

[project.scripts]
ds-crew-service = "ds_crew.service.__main__:main"
ds-crew-maf = "ds_crew.maf.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_crew"]

[tool.pytest.ini_options]
# Deliberately NOT parallelised with pytest-xdist. It looks like the obvious
# win on a ~7 minute suite, but it was benchmarked and rejected: this suite is
# already parallel *inside* scikit-learn (BASE_MODEL_KWARGS sets n_jobs/
# thread_count to -1, and permutation_importance runs n_jobs=-1), so xdist
# workers contend for the same cores rather than adding throughput. Measured on
# a 16-core box against a 417s serial baseline: `-n 4` took 544s (30% SLOWER),
# and even with OMP/MKL thread pinning plus `--dist loadfile` the best config
# (`-n 8`) reached only 390s -- a 6.6% gain that also broke one test
# reproducibly, indicating real cross-test coupling that serial execution hides
# (tests share a fixed run_id, "test-run-001", and therefore one `runs/`
# artifact directory -- a likely but unconfirmed cause). Anyone enabling xdist
# must diagnose that first.
# Thread pinning cannot fix the core contention either: joblib's loky
# backend spawns *processes*, which OMP_NUM_THREADS does not govern.
# Re-benchmark before reaching for it again; don't assume it helps.
testpaths = ["tests"]
# ds_crew.maf's tests are `async def` throughout; auto mode means they don't
# each need an explicit @pytest.mark.asyncio.
asyncio_mode = "auto"
# Silence mlflow's internal pydantic deprecation noise only, which otherwise
# buries anything this project actually emits. Scoped by message on purpose:
# a blanket `ignore::DeprecationWarning` would also hide deprecations raised
# by ds_crew's own code, which is exactly the signal worth keeping.
filterwarnings = [
    "ignore:.*class-based `config`.*:DeprecationWarning",
    "ignore:.*`@model_validator` with mode=.after.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
