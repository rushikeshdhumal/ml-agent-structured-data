[project]
name = "ml-agent-structured-data"
version = "0.1.0"
description = "DS-Crew: a CrewAI multi-agent system covering the data science lifecycle for structured data: EDA, cleaning, feature engineering, model selection, HPO, evaluation, and metadata logging."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "Rushikesh Dhumal" }]
dependencies = [
    "crewai[tools]>=1.15.1,<2",
    "pandas>=2.2,<3",
    # Upper bound is set by shap, not by anything this project needs directly:
    # shap depends on numba (a hard dependency on every platform except
    # darwin/x86_64), and numba 0.66.0 -- the latest -- requires numpy<2.5.
    # Without this cap uv backtracks through numba releases looking for one
    # that accepts numpy 2.5.x, finds none, and lands on a 2021-era
    # numba/llvmlite pair that cannot build on Python 3.13 at all. Lift this
    # only once numba publishes numpy 2.5 support.
    "numpy>=1.26,<2.5",
    "scikit-learn>=1.5,<2",
    "optuna>=3.6,<4",
    "mlflow>=2.15,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.9,<4",
    "joblib>=1.4,<2",
    "xgboost>=2.0,<3",
    "lightgbm>=4.0,<5",
    "catboost>=1.2,<2",
    "shap>=0.46,<1",
    # Not imported directly -- it is shap's transitive dependency, floored here
    # to steer uv's *universal* resolution. Resolving for a single interpreter
    # picks numba 0.66.0 correctly, but resolving across all of requires-python
    # at once, uv forks and selects numba 0.53.1 for python>=3.11 (a release
    # predating 3.11 entirely), whose ancient llvmlite then fails to build.
    # This floor removes that branch. Drop it if uv's forking resolver stops
    # producing that result.
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.6,<1",
]

[project.scripts]
ds-crew = "ds_crew.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_crew"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require a live LLM key; skipped by default",
]
addopts = "-m 'not e2e'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
