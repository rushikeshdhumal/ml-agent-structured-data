[project]
name = "ml-agent-structured-data"
version = "0.1.0"
description = "DS-Crew: a CrewAI multi-agent system covering the data science lifecycle for structured data: EDA, cleaning, feature engineering, model selection, HPO, evaluation, and metadata logging."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "Rushikesh Dhumal" }]
dependencies = [
    "crewai[tools]>=1.15.1,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "optuna>=3.6,<4",
    "mlflow>=2.15,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.9,<4",
    "joblib>=1.4,<2",
    "xgboost>=2.0,<3",
    "lightgbm>=4.0,<5",
    "catboost>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    "ruff>=0.6,<1",
]

[project.scripts]
ds-crew = "ds_crew.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_crew"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require a live LLM key; skipped by default",
]
addopts = "-m 'not e2e'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
